    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/lancidr.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./ruleset/applications.yaml
    interval: 86400
  customDirect:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/helllkz/rules/main/direct.yaml
    path: ./ruleset/customDirect.yaml
    interval: 86400
  customProxy:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/helllkz/rules/main/proxy.yaml
    path: ./ruleset/customProxy.yaml
    interval: 86400
  SteamCommunity:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/helllkz/rules/main/steamcommunity.yaml
    path: ./ruleset/SteamCommunity.yaml
    interval: 86400
rules:
- DOMAIN-SUFFIX,local,DIRECT
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- RULE-SET,applications,DIRECT
- RULE-SET,private,DIRECT
- RULE-SET,customDirect,DIRECT
- GEOSITE,steam@cn,DIRECT
- GEOSITE,apple-cn,DIRECT
- GEOSITE,apple,Apple
- GEOSITE,category-games@cn,DIRECT
- GEOSITE,category-ads-all,广告过滤
- RULE-SET,reject,REJECT
- GEOSITE,netflix,NETFLIX
- GEOSITE,youtube,YOUTUBE
- GEOSITE,tiktok,Tiktok
- GEOSITE,bahamut,巴哈姆特
- GEOSITE,openai,OpenAI
- GEOSITE,anthropic,Claude
- RULE-SET,SteamCommunity,Steam创意工坊
- GEOSITE,steam,Steam
- GEOSITE,telegram,Telegram
- RULE-SET,tld-not-cn,默认
- RULE-SET,gfw,默认
- RULE-SET,proxy,默认
- RULE-SET,telegramcidr,默认
- RULE-SET,customProxy,默认
